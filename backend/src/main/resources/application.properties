spring.application.name=helpdesk-backend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:helpdesk_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:helpdesk_app_dev_password}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${SPRING_FLYWAY_USER:helpdesk}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:helpdesk_dev_password}

# JWT
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value
app.jwt.expiration-ms=900000

app.storage.local-directory=./local-storage
app.ai-service.url=http://ai-service:8000
app.kb.rag.similarity-threshold=${KB_RAG_SIMILARITY_THRESHOLD:0.70}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# Structured logging
logging.structured.format.console=logstash
# Actuator health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis,aiService,aiService
