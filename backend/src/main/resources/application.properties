spring.application.name=helpdesk-backend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=helpdesk
spring.datasource.password=helpdesk_dev_password

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value
app.jwt.expiration-ms=900000

app.storage.local-directory=./local-storage
app.ai-service.url=http://ai-service:8000