spring.application.name=helpdesk-backend

# Browser origin allowed to access the API and WebSocket
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:helpdesk_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB


# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${SPRING_FLYWAY_USER:helpdesk}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.websocket-ticket-expiration-ms=60000
app.jwt.issuer=ai-helpdesk-saas
app.jwt.audience=ai-helpdesk-api

app.storage.local-directory=./local-storage
app.ai-service.url=http://ai-service:8000
app.kb.rag.similarity-threshold=${KB_RAG_SIMILARITY_THRESHOLD:0.70}
app.kb.response-assistant.similarity-threshold=${KB_RESPONSE_ASSISTANT_SIMILARITY_THRESHOLD:0.60}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# Structured logging
logging.structured.format.console=logstash
# Actuator health
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis,aiService,aiService
